name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - name: Autobuild (CGO off)
        env:
          CGO_ENABLED: "0"
        run: go build ./util ./value ./expr ./store ./fetchers ./flake ./external ./nixmain
      - uses: github/codeql-action/analyze@v3
