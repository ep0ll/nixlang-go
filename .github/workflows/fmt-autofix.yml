name: Format Go sources

on:
  push:
    branches: [feat/full-cgo-bindings]

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-cgo-bindings
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Format and commit
        run: |
          mapfile -t files < <(gofmt -l .)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "gofmt clean"
            exit 0
          fi
          gofmt -w "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "style: format Go sources"
          git push origin HEAD:feat/full-cgo-bindings
