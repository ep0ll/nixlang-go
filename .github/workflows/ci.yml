name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (CGO off / stubs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Unit tests
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./util ./value ./expr ./store ./fetchers ./flake ./external ./nixmain -count=1

      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./util ./value ./expr ./store ./fetchers ./flake ./external ./nixmain

      - name: Build library packages
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./util ./value ./expr ./store ./fetchers ./flake ./external ./nixmain

  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt clean"

  nix-capi:
    name: Nix C API build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Enter flake and verify C API
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            export CGO_ENABLED=1
            echo "Nix: $(nix --version || true)"
            if ./scripts/check-capi.sh; then
              echo "check-capi OK"
              go test -tags=nix ./... -count=1
            else
              echo "::warning::check-capi failed — falling back to CGO=0 unit tests"
              CGO_ENABLED=0 go test ./util ./value -count=1
            fi
          '
