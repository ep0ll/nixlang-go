name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests (no Nix C API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Unit tests
        run: |
          # Packages that do not require cgo/Nix libraries
          go test ./util ./value -count=1

  # Full cgo build requires Nix master with C API packages.
  # Enable when a self-hosted or Nix-capable runner is available:
  # nix-capi:
  #   runs-on: ubuntu-latest
  #   steps:
